name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: |
        mkdir -p "$ANDROID_HOME/licenses"
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"

    - name: Install required Android SDK components
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Create local.properties with API Key
      run: |
        if [ -z "${{ secrets.YOUTUBE_API_KEY }}" ]; then
          echo "WARNING: YOUTUBE_API_KEY secret is not set!"
          echo "youtube.api.key=DUMMY_KEY_FOR_BUILD" > local.properties
        else
          echo "youtube.api.key=${{ secrets.YOUTUBE_API_KEY }}" > local.properties
        fi
        cat local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download fresh Gradle Wrapper JAR
      run: |
        WRAPPER_JAR="gradle/wrapper/gradle-wrapper.jar"
        WRAPPER_VERSION="8.5"
        echo "Downloading gradle-wrapper.jar v${WRAPPER_VERSION}..."
        if ! curl -L -s "https://github.com/gradle/gradle/raw/v${WRAPPER_VERSION}/gradle/wrapper/gradle-wrapper.jar" -o "$WRAPPER_JAR"; then
          echo "Falling back to Gradle distribution..."
          curl -L -s "https://services.gradle.org/distributions/gradle-${WRAPPER_VERSION}-bin.zip" -o /tmp/gradle.zip
          unzip -p /tmp/gradle.zip "gradle-${WRAPPER_VERSION}/lib/plugins/gradle-wrapper-${WRAPPER_VERSION}.jar" > "$WRAPPER_JAR"
          rm -f /tmp/gradle.zip
        fi
        echo "Wrapper JAR size: $(stat -c%s "$WRAPPER_JAR") bytes"

    - name: Build Debug APK with Gradle
      run: |
        chmod +x gradlew
        echo "=== Verifying Gradle Wrapper JAR ==="
        ls -la gradle/wrapper/gradle-wrapper.jar
        unzip -l gradle/wrapper/gradle-wrapper.jar | grep GradleWrapperMain || echo "CLASS NOT FOUND IN JAR!"
        echo "=== Running Gradle ==="
        java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug --stacktrace

    - name: List APK output directory
      run: |
        echo "APK output directory:"
        ls -la app/build/outputs/apk/debug/ || echo "Directory not found!"
        find . -name "*.apk" -type f 2>/dev/null

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
