name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install required Android SDK components
      run: |
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

    - name: Accept Android SDK licenses
      run: |
        yes | sdkmanager --licenses

    - name: Create local.properties with API Key
      run: |
        if [ -z "${{ secrets.YOUTUBE_API_KEY }}" ]; then
          echo "WARNING: YOUTUBE_API_KEY secret is not set!"
          echo "youtube.api.key=DUMMY_KEY_FOR_BUILD" > local.properties
        else
          echo "youtube.api.key=${{ secrets.YOUTUBE_API_KEY }}" > local.properties
        fi
        cat local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: List APK output directory
      run: |
        echo "APK output directory:"
        ls -la app/build/outputs/apk/debug/ || echo "Directory not found!"
        find . -name "*.apk" -type f 2>/dev/null

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
